/* ============================================================
   نَسَق — نظام التصميم
   هوية: ذهب السَّحَر (فعل ونيّة) + ريحان (نموّ وإنجاز) على حبر النخيل
   ============================================================ */
:root{
  --f-body:'PlexAr','Alexandria',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Alexandria','PlexAr',system-ui,sans-serif;
  --r-xl:26px; --r-lg:20px; --r-md:15px; --r-sm:11px;
  --dur:.32s; --ease:cubic-bezier(.33,1,.35,1); --spring:cubic-bezier(.34,1.45,.5,1);
  --nav-h:66px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0E1613; --bg2:#0B110F; --card:#17231F; --card2:#1D2C26; --card3:#24352E;
  --line:#243329; --line2:#33473C;
  --ink:#EDF4EF; --ink2:#A8BAAF; --ink3:#6E8177;
  --gold:#E9B44C; --gold2:#F6D080; --on-gold:#261903;
  --basil:#5ECD9F; --basil2:#8CE2BE; --on-basil:#06231733; --basil-dim:rgba(94,205,159,.13);
  --clay:#E8705B; --clay-dim:rgba(232,112,91,.13);
  --azure:#5FAFD9; --azure-dim:rgba(95,175,217,.13);
  --gold-dim:rgba(233,180,76,.13);
  --shadow:0 14px 34px -18px rgba(0,0,0,.75);
  --shadow-hi:0 20px 48px -20px rgba(0,0,0,.85);
  --thread:#33473C; --grain-op:.05; --scrim:rgba(4,8,6,.62);
  --heat0:#1B2823;
}
[data-theme="light"]{
  --bg:#F2EEE3; --bg2:#EAE5D6; --card:#FFFDF6; --card2:#F8F4E9; --card3:#F1ECDD;
  --line:#E1DAC6; --line2:#CFC6AE;
  --ink:#1A2721; --ink2:#53645B; --ink3:#8A9890;
  --gold:#D3941F; --gold2:#B87F14; --on-gold:#FFFBEF;
  --basil:#1E9A6D; --basil2:#157C56; --basil-dim:rgba(30,154,109,.12);
  --clay:#CE4B36; --clay-dim:rgba(206,75,54,.11);
  --azure:#2380AE; --azure-dim:rgba(35,128,174,.11);
  --gold-dim:rgba(211,148,31,.13);
  --shadow:0 12px 28px -16px rgba(90,78,44,.28);
  --shadow-hi:0 18px 40px -18px rgba(90,78,44,.38);
  --thread:#CFC6AE; --grain-op:.035; --scrim:rgba(38,33,18,.45);
  --heat0:#E7E1CF;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background var(--dur),color var(--dur);
}
/* حُبيبات ورقيّة خفيفة تمنح الملمس */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--grain-op);
  background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity=".6"/></svg>');
}
h1,h2,h3,h4{margin:0;font-family:var(--f-disp);line-height:1.4}
p{margin:0}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit;font-size:15px}
::selection{background:var(--gold);color:var(--on-gold)}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:6px}

.heat i.l3{background:color-mix(in srgb,var(--basil) 78%,var(--heat0))}
.heat i.l4{background:var(--basil)}
.heat i.tod{outline:1.5px solid var(--gold);outline-offset:1px}
.heat-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px;font:600 10px var(--f-body);color:var(--ink3)}
.heat-leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chart-c{width:100%;height:150px;display:block}
/* السُّبحة */
.misbaha{position:relative;padding:24px 16px 14px}
.misbaha .thread{position:absolute;inset-inline:18px;top:40px;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--thread) 12%,var(--thread) 88%,transparent);transition:.5s}
.misbaha.perfect .thread{background:linear-gradient(90deg,transparent,var(--gold) 12%,var(--gold) 88%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--gold) 60%,transparent)}
.misbaha .beads{position:relative;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;min-height:34px;align-items:center}
.bead{width:22px;height:22px;border-radius:99px;border:2px solid var(--line);background:radial-gradient(circle at 35% 30%,var(--card3),var(--card2));cursor:pointer;padding:0;transition:.3s cubic-bezier(.34,1.56,.64,1)}
.bead.task{border-radius:8px}
.bead:active{transform:scale(.85)}
.bead.done{background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold));border-color:transparent;box-shadow:0 0 11px color-mix(in srgb,var(--gold) 45%,transparent);transform:scale(1.07)}
.bead.task.done{background:radial-gradient(circle at 35% 30%,#8CE2BE,var(--basil));box-shadow:0 0 11px color-mix(in srgb,var(--basil) 45%,transparent)}
.m-cap{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:800 12px var(--f-disp);color:var(--ink2)}
.m-cap span{color:var(--gold)}
/* الحلقات */
.ringw{position:relative;display:grid;place-items:center;flex:none}
.ringw svg{transform:rotate(-90deg);display:block}
.ringw .tr{stroke:var(--heat0)}
.ringw .pr{stroke:var(--gold);transition:stroke-dashoffset .5s}
.ringw .rc{position:absolute;text-align:center}
.rc .v{font:800 15px var(--f-disp)}
.rc .l{font:600 9px var(--f-body);color:var(--ink3)}
/* الأهداف */
.goal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}
.g-top{display:flex;align-items:center;gap:12px}
.g-top .tx{flex:1;min-width:0}
.g-top b{font:700 14px var(--f-disp)}
.g-top .faint{font:600 11px var(--f-body);margin-top:3px}
.g-top>.i,.srow>.i:last-child{width:16px;height:16px;color:var(--ink3);transform:scaleX(-1);flex:none}
.goal .ringw .pr{stroke:var(--gc,var(--gold))}
.gbar{height:8px;border-radius:99px;background:var(--heat0);overflow:hidden;margin-top:12px}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--gc,var(--basil));transition:width .45s}
/* شاشة التركيز */
.focus-stage{display:flex;flex-direction:column;align-items:center;padding-top:12px}
.fring{position:relative;width:min(72vw,290px);aspect-ratio:1}
.fring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.fring .base{stroke:var(--heat0)}
.fring .prog{stroke:var(--gold);transition:stroke-dashoffset .3s linear,stroke .4s}
.fring.break .prog{stroke:var(--basil)}
.fring.run .prog{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--gold) 55%,transparent))}
.fring.break.run .prog{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--basil) 55%,transparent))}
.ft{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.ft .ph{font:800 11px var(--f-disp);color:var(--ink3)}
.ft .time{font:800 54px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.task-on{font:600 11px var(--f-body);color:var(--gold);max-width:70%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.rounds{display:flex;gap:8px;margin:16px 0 4px}
.rounds i{width:9px;height:9px;border-radius:99px;background:var(--heat0)}
.rounds i.y{background:var(--gold)}
.rounds i.cur{outline:1.5px solid var(--gold);outline-offset:2px}
.fctrl{display:flex;align-items:center;gap:18px;margin-top:14px}
.fctrl .main{width:76px;height:76px;border-radius:26px;border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--on-gold);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px color-mix(in srgb,var(--gold) 30%,transparent);transition:transform .15s}
.fctrl .main:active{transform:scale(.93)}
.fctrl .main .i{width:30px;height:30px}
.fctrl .side{width:48px;height:48px;border-radius:17px;border:1px solid var(--line);background:var(--card);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.fctrl .side .i{width:20px;height:20px}
.amb{display:flex;flex-direction:column;gap:2px}
#timer-wrap.hide{display:none}
.breath-wrap{display:none;flex-direction:column;align-items:center;padding:26px 0 10px}
.breath-wrap.on{display:flex}
.borb{width:150px;height:150px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--azure) 50%,var(--basil)),var(--basil));box-shadow:0 0 0 14px color-mix(in srgb,var(--basil) 10%,transparent),0 0 46px color-mix(in srgb,var(--basil) 28%,transparent);transition:transform 4s ease-in-out;color:#04231A}
.borb b{font:800 17px var(--f-disp)}
.borb small{font:700 10px var(--f-body);opacity:.7}
.borb.in{transform:scale(1.32)}
.borb.out{transform:scale(.78)}
/* الخبرة والأوسمة */
.xpbar{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px}
.xr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvl{display:flex;align-items:center;gap:10px}
.lb{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--on-gold);display:grid;place-items:center;font:800 17px var(--f-disp);flex:none}
.lvl b{font:800 13.5px var(--f-disp);display:block}
.lvl span{font:600 11px var(--f-body);color:var(--ink3)}
.xpline{height:8px;border-radius:99px;background:var(--heat0);margin-top:12px;overflow:hidden}
.xpline i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px 12px;text-align:center}
.badge .bi{width:40px;height:40px;margin:0 auto 8px;border-radius:14px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);display:grid;place-items:center}
.badge .bi .i{width:19px;height:19px}
.badge b{font:700 11px var(--f-body);display:block}
.badge span{font:600 9px/1.5 var(--f-body);color:var(--ink3);display:block;margin-top:3px}
.badge .xg{position:absolute;top:7px;inset-inline-end:8px;font:800 9px var(--f-disp);color:var(--basil)}
.badge.lock{opacity:.42;filter:grayscale(.65)}
/* اليوميات والمزاج */
.jent{border-top:1px solid var(--line);padding:12px 0}
.jh{display:flex;align-items:center;gap:8px;font:700 12px var(--f-body);flex-wrap:wrap}
.jh .i{width:17px;height:17px;color:var(--gold)}
.jh .num{margin-inline-start:auto;color:var(--ink3);font-size:11px}
.jent p{font:500 12.5px/1.85 var(--f-body);color:var(--ink2);margin-top:7px}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;aspect-ratio:1;max-width:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink3);display:grid;place-items:center;cursor:pointer;transition:.15s}
.moods button .i{width:24px;height:24px}
.moods button.on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 13%,var(--card));transform:scale(1.06)}
/* المصفوفة */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.quad{border-radius:16px;padding:11px;border:1px solid var(--line);background:var(--card);min-height:112px}
.quad h4{display:flex;align-items:center;gap:5px;font:800 11.5px var(--f-disp)}
.quad h4 .i{width:13px;height:13px}
.quad .qd{font:600 9.5px var(--f-body);color:var(--ink3);margin:3px 0 8px}
.quad.q1{border-color:color-mix(in srgb,var(--clay) 45%,var(--line))}
.quad.q1 h4{color:var(--clay)}
.quad.q2{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.quad.q2 h4{color:var(--gold)}
.quad.q3 h4{color:var(--azure)}
.quad.q4 h4{color:var(--ink3)}
.mt{display:flex;align-items:center;gap:6px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:5px;font:600 11px var(--f-body);color:var(--ink);cursor:pointer;text-align:start}
.mt i{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.mt i .i{width:9px;height:9px}
.mt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* الإعداد الأولي */
#onb{position:fixed;inset:0;z-index:200;display:none;background:var(--bg);padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#onb.on{display:flex}
.ob-card{margin:auto;width:100%;max-width:420px;display:flex;flex-direction:column;min-height:78vh}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.ob-body h2{font:800 30px var(--f-disp);margin-top:18px}
.ob-body p{font:500 13.5px/2 var(--f-body);color:var(--ink2);margin-top:10px}
.ob-logo{display:grid;place-items:center}
.ob-logo img{width:104px;height:104px;border-radius:30px;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.ic-big{width:88px;height:88px;border-radius:28px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);margin:0 auto}
.ic-big .i{width:38px;height:38px}
.ob-feats{display:flex;flex-direction:column;gap:12px;text-align:start}
.obf{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px}
.obf .ic{width:44px;height:44px;border-radius:15px;background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);display:grid;place-items:center;flex:none}
.obf b{font:800 14px var(--f-disp);display:block}
.obf span{font:500 11.5px/1.7 var(--f-body);color:var(--ink3)}
.ob-dots{display:flex;gap:7px;justify-content:center;margin:20px 0}
.ob-dots i{width:7px;height:7px;border-radius:99px;background:var(--heat0);transition:.25s}
.ob-dots i.on{width:22px;background:var(--gold)}
.ob-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
#onb .tmpl{margin-top:16px;text-align:start;max-height:42vh;overflow-y:auto}
/* متفرقات */
.flash{animation:nsqflash .9s ease}
@keyframes nsqflash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 65%,transparent)}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 14px}
body.locked{overflow:hidden}
.d7{display:flex;gap:6px}
.dc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;transition:.15s}
.dc b{font:800 13px var(--f-disp)}
.dc span{font:600 9px var(--f-body);color:var(--ink3)}
.dc.y{background:color-mix(in srgb,var(--hc,var(--basil)) 16%,var(--card));border-color:var(--hc,var(--basil))}
.dc.y b{color:var(--hc,var(--basil))}
.dc.tod{outline:1.5px solid var(--gold);outline-offset:1px}
.dc:disabled{opacity:.32;cursor:default}
.immersive #nav,.immersive #fab{display:none!important}
.immersive #app{padding-bottom:24px}
</style>

<script>
'use strict';
/* ================= أدوات عامة ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,cls)=>'<svg class="'+(cls||'i')+'"><use href="#i-'+n+'"/></svg>';

/*#PURE*/
/* ================= التواريخ ================= */
const dkey=d=>{const x=d instanceof Date?d:new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fromKey=k=>{const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const diffDays=(a,b)=>Math.round((fromKey(b)-fromKey(a))/864e5);
const todayKey=()=>dkey(new Date());
const weekdayOf=k=>fromKey(k).getDay();
const weekStartOf=(k,ws)=>{let d=fromKey(k);while(d.getDay()!==ws)d.setDate(d.getDate()-1);return dkey(d)};

/* ================= جدولة العادات وسلاسلها =================
   freq.kind: daily | days (أيام محددة) | weekly (X مرات أسبوعيًا) */
const habitScheduledOn=(h,k)=>{
  if(h.archived)return false;
  if(h.createdKey&&k<h.createdKey)return false;
  if(h.freq.kind==='days')return h.freq.days.includes(weekdayOf(k));
  return true;
};
const habitCountOn=(h,log,k)=>((log[k]||{})[h.id])||0;
const habitTarget=h=>h.type==='count'?Math.max(1,h.target||1):1;
const habitFulfilled=(h,log,k)=>habitCountOn(h,log,k)>=habitTarget(h);
const weekFulfilledCount=(h,log,k,ws)=>{
  let c=0,d=weekStartOf(k,ws);
  for(let i=0;i<7;i++){if(habitFulfilled(h,log,d))c++;d=addDays(d,1);}
  return c;
};
const habitStreak=(h,log,todayK,ws)=>{
  if(h.freq.kind==='weekly'){
    const need=Math.max(1,h.freq.times||1);let s=0,wk=weekStartOf(todayK,ws);
    if(weekFulfilledCount(h,log,todayK,ws)>=need)s++;
    wk=addDays(wk,-7);
    for(let i=0;i<520;i++){
      if(weekFulfilledCount(h,log,wk,ws)>=need){s++;wk=addDays(wk,-7);}else break;
    }
    return s;
  }
  let s=0,k=todayK;
  if(habitScheduledOn(h,k)&&!habitFulfilled(h,log,k))k=addDays(k,-1); // اليوم الجاري لا يقطع السلسلة
  for(let i=0;i<3660;i++){
    if(h.createdKey&&k<h.createdKey)break;
    if(habitScheduledOn(h,k)){
      if(habitFulfilled(h,log,k)){s++;}else break;
    }
    k=addDays(k,-1);
  }
  return s;
};
const habitBestStreak=(h,log,todayK,ws)=>{
  if(h.freq.kind==='weekly'){
    const need=Math.max(1,h.freq.times||1);let best=0,cur=0;
    let wk=weekStartOf(h.createdKey||todayK,ws);const end=weekStartOf(todayK,ws);
    for(let i=0;i<520&&wk<=end;i++){
      if(weekFulfilledCount(h,log,wk,ws)>=need){cur++;best=Math.max(best,cur);}else cur=0;
      wk=addDays(wk,7);
    }
    return best;
  }
  let best=0,cur=0,k=h.createdKey||todayK;
  for(let i=0;i<3660&&k<=todayK;i++){
    if(habitScheduledOn(h,k)){
      if(habitFulfilled(h,log,k)){cur++;best=Math.max(best,cur);}else cur=0;
    }
    k=addDays(k,1);
  }
  return best;
};
const habitRate=(h,log,fromK,toK)=>{ // نسبة الالتزام خلال مدى
  let sch=0,ok=0,k=fromK<(h.createdKey||fromK)?(h.createdKey||fromK):fromK;
  for(let i=0;i<400&&k<=toK;i++){
    if(habitScheduledOn(h,k)){sch++;if(habitFulfilled(h,log,k))ok++;}
    k=addDays(k,1);
  }
  if(h.freq.kind==='weekly'){const need=Math.max(1,h.freq.times||1);
    const days=Math.max(1,diffDays(fromK,toK)+1);const exp=need*days/7;
    return clamp(ok/Math.max(1,exp),0,1);}
  return sch?ok/sch:0;
};
/* تحليل الإضافة السريعة للمهام */
const parseQuick=(text,todayK)=>{
  let x=String(text||'').trim();const pr={imp:false,urg:false};let due=null;
  const D='[\\u064B-\\u065F\\u0670]*';
  const reBaad=new RegExp('(^|\\s)ب'+D+'ع'+D+'د'+D+'\\s+غ'+D+'د'+D+'(?:ا'+D+')?(?=\\s|$)');
  const reGhad=new RegExp('(^|\\s)غ'+D+'د'+D+'(?:ا'+D+')?(?=\\s|$)');
  const reYawm=new RegExp('(^|\\s)ا'+D+'ل'+D+'ي'+D+'و'+D+'م'+D+'(?=\\s|$)');
  if(reBaad.test(x)){due=addDays(todayK,2);x=x.replace(reBaad,' ');}
  else if(reGhad.test(x)){due=addDays(todayK,1);x=x.replace(reGhad,' ');}
  else if(reYawm.test(x)){due=todayK;x=x.replace(reYawm,' ');}
  if(x.includes('!')){pr.urg=true;x=x.replace(/!/g,'');}
  if(x.includes('*')){pr.imp=true;x=x.replace(/\*/g,'');}
  return{t:x.replace(/\s+/g,' ').trim(),due,pr};
};
/* تصفية المهام بالبحث والوسم */
const filterTasks=(arr,q,tag)=>{q=(q||'').trim();
  return arr.filter(t=>{
    if(tag&&t.tag!==tag)return false;
    if(!q)return true;
    const hay=t.title+' '+(t.notes||'')+' '+((t.subs||[]).map(s=>s.t).join(' '));
    return hay.includes(q);});};
/*#ENDPURE*/

const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WD_S=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const WD_MIN=['ح','ن','ث','ر','خ','ج','س'];
const MO=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const fmtDate=k=>{const d=fromKey(k);return WD[d.getDay()]+'، '+d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear()};
const fmtShort=k=>{const d=fromKey(k);return d.getDate()+' '+MO[d.getMonth()]};
const hijriToday=()=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){return''}};
const relDue=k=>{const t=todayKey(),d=diffDays(t,k);
  if(d===0)return{t:'اليوم',c:'gold'};if(d===1)return{t:'غدًا',c:'azure'};
  if(d===-1)return{t:'أمس',c:'clay'};if(d<0)return{t:'متأخرة '+(-d)+' يوم',c:'clay'};
  if(d<=7)return{t:WD[weekdayOf(k)],c:'azure'};return{t:fmtShort(k),c:''}};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' د';const h=Math.floor(m/60),r=m%60;return h+' س'+(r?' '+r+' د':'')};

  if(h<5)return'سهرة موفّقة';if(h<12)return'صباح النَّسَق';if(h<17)return'نهارك منظّم';if(h<22)return'مساء الإنجاز';return'ليلة هادئة'};

/* ================= محرّك الصوت (تصنيع كامل، بلا ملفات) ================= */
const AU={ctx:null,master:null,_white:null,_brown:null,
  ensure(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    this.ctx=new AC();this.master=this.ctx.createGain();
    this.master.gain.value=S.settings.vol;this.master.connect(this.ctx.destination);}
    if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  setVol(v){if(this.master)this.master.gain.value=v;},
  white(){if(!this._white){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this._white=b;}return this._white;},
  brown(){if(!this._brown){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);
    let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.4;}this._brown=b;}return this._brown;},
  tone(o){const c=this.ensure();if(!c||!S.settings.sound)return;
    const t=c.currentTime+(o.at||0),dur=o.dur||.2;
    const osc=c.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+dur*.9);
    const g=c.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.vol??.2,t+(o.att||.005));
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let node=osc;
    if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;osc.connect(f);node=f;}
    node.connect(g);g.connect(this.master);osc.start(t);osc.stop(t+dur+.05);},
  blip(o){const c=this.ensure();if(!c||!S.settings.sound)return; // نبضة ضجيج قصيرة
    const t=c.currentTime+(o.at||0),src=c.createBufferSource();src.buffer=this.white();
    const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.value=o.f||2500;f.Q.value=o.q||1;
    const g=c.createGain();g.gain.setValueAtTime(o.vol??.15,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+(o.dur||.05));
    src.connect(f);f.connect(g);g.connect(this.master);src.start(t);src.stop(t+(o.dur||.05)+.02);},
  bell(f,at,vol){[1,2.76,5.4].forEach((m,i)=>this.tone({f:f*m,at,dur:1.6-(i*.4),vol:(vol??.16)/(i+1),type:'sine'}));}
};
const SFX={

  start(){AU.blip({f:420,ft:'lowpass',dur:.3,vol:.1});AU.tone({f:330,slide:660,dur:.3,vol:.09,type:'sine'});},

  fanfare(){[523,659,784,1046].forEach((f,i)=>AU.tone({f,at:i*.09,dur:.3,vol:.13,type:'triangle',lp:2200}));buzz([25,30,25]);},

/* أصوات محيطة توليدية لجلسات التركيز */
class Amb{
  constructor(build){this.build=build;this.nodes=null;this.g=null;this.v=0;this.uv=0;}
  ensure(){const c=AU.ensure();if(!c)return;
    if(!this.g){this.g=c.createGain();this.g.gain.value=0;this.g.connect(AU.master);}
    if(!this.nodes){this.nodes=this.build(c,this.g)||{};}}
  set(v){this.v=v;if(v>0)this.ensure();if(this.g)this.g.gain.linearRampToValueAtTime(v,AU.ctx.currentTime+.25);
    if(v===0)this.sched(false);else this.sched(true);}
  sched(on){if(this.nodes&&this.nodes.timer){clearInterval(this.nodes.timer.id);
    if(on&&this.nodes.timer.fn)this.nodes.timer.id=setInterval(this.nodes.timer.fn,this.nodes.timer.ms);}}
}
const AMB={
  rain:new Amb((c,out)=>{const s=c.createBufferSource();s.buffer=AU.white();s.loop=true;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=250;
    s.connect(hp);hp.connect(lp);lp.connect(out);s.start();
    const t={ms:340,fn:()=>{if(Math.random()<.7)AU.tone({f:2100+Math.random()*2400,slide:600,dur:.045,vol:.028*AMB.rain.v,type:'sine'});},id:0};
    return{timer:t};}),
  waves:new Amb((c,out)=>{const s=c.createBufferSource();s.buffer=AU.brown();s.loop=true;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    const g=c.createGain();g.gain.value=.5;
    const lfo=c.createOscillator();lfo.frequency.value=.07;
    const la=c.createGain();la.gain.value=.42;lfo.connect(la);la.connect(g.gain);lfo.start();
    s.connect(lp);lp.connect(g);g.connect(out);s.start();return{};}),
  wind:new Amb((c,out)=>{const s=c.createBufferSource();s.buffer=AU.white();s.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=1.1;
    const lfo=c.createOscillator();lfo.frequency.value=.11;
    const la=c.createGain();la.gain.value=300;lfo.connect(la);la.connect(bp.frequency);lfo.start();
    const g=c.createGain();g.gain.value=.75;s.connect(bp);bp.connect(g);g.connect(out);s.start();return{};}),
  ember:new Amb((c,out)=>{const s=c.createBufferSource();s.buffer=AU.brown();s.loop=true;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=210;
    s.connect(lp);lp.connect(out);s.start();
    const t={ms:190,fn:()=>{if(Math.random()<.55)AU.blip({f:2600+Math.random()*2600,dur:.02+Math.random()*.03,vol:.05*AMB.ember.v,q:1.4});},id:0};
    return{timer:t};})
};
const AMB_BASE={rain:.5,waves:.62,wind:.36,ember:.5};
function ambApply(id){const on=(typeof FT!=='undefined'&&FT.running)&&S.settings.sound;
  AMB[id].set((AMB[id].uv||0)*AMB_BASE[id]*(on?1:0));}
function ambSyncAll(){for(const k in AMB)ambApply(k);}

function toast(msg,icon){const t=document.createElement('div');t.className='toast';
  t.innerHTML=ic(icon||'check')+esc(msg);$('#toasts').append(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2400);}
const Layers={stack:[],
  push(close){this.stack.push(close);history.pushState({nsq:this.stack.length},'');},
  closeTop(){const f=this.stack.pop();if(f)f();},
  back(){if(this.stack.length)history.back();}
};
window.addEventListener('popstate',()=>{Layers.closeTop();});
function updOvl(){const open=$('#sheet').classList.contains('on')||$('#modal').classList.contains('on');
$('#ovl').classList.toggle('on',open);document.body.classList.toggle('locked',open);}
function sheetOpen(){return $('#sheet').classList.contains('on');}
function openSheet(html,onOpen){const sh=$('#sheet');sh.innerHTML='<div class="grab"></div>'+html;
  sh.classList.add('on');updOvl();SFX.open();
  Layers.push(()=>{sh.classList.remove('on');updOvl();});
  if(onOpen)onOpen(sh);}
function closeSheet(){Layers.back();}
function askConfirm(title,msg,okLabel,danger){return new Promise(res=>{
  const m=$('#modal'),b=$('#modalBox');let result=false;
  b.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p>'+
    '<div style="display:flex;gap:9px"><button class="btn soft" style="flex:1" data-x="0">إلغاء</button>'+
    '<button class="btn '+(danger?'danger':'gold')+'" style="flex:1" data-x="1">'+esc(okLabel||'تأكيد')+'</button></div>';
  m.classList.add('on');updOvl();
  Layers.push(()=>{m.classList.remove('on');updOvl();b.onclick=null;res(result);});
  b.onclick=e=>{const x=e.target.closest('[data-x]');if(!x)return;
    result=x.dataset.x==='1';Layers.back();};
});}

/* ================= قصاصات الاحتفال ================= */
const Confetti={c:null,x:null,ps:[],raf:0,
  init(){this.c=$('#confetti');this.x=this.c.getContext('2d');this.rs();addEventListener('resize',()=>this.rs());},
  rs(){const d=devicePixelRatio||1;this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.x.setTransform(d,0,0,d,0,0);},
  burst(x,y,n,cols){cols=cols||['#E9B44C','#F6D080','#5ECD9F','#8CE2BE'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*6;
      this.ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.22,r:2.5+Math.random()*3.5,
        c:cols[i%cols.length],l:1,rot:Math.random()*6,vr:(Math.random()-.5)*.3,sq:Math.random()<.5});}
    if(!this.raf)this.loop();},
  loop(){this.raf=requestAnimationFrame(()=>this.loop());const x=this.x;
    x.clearRect(0,0,innerWidth,innerHeight);
    this.ps=this.ps.filter(p=>p.l>0);
    if(!this.ps.length){cancelAnimationFrame(this.raf);this.raf=0;return;}
    for(const p of this.ps){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=.012;p.rot+=p.vr;
      x.save();x.globalAlpha=Math.max(0,p.l);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;
      if(p.sq)x.fillRect(-p.r,-p.r,p.r*2,p.r*2);else{x.beginPath();x.arc(0,0,p.r,0,7);x.fill();}
      x.restore();}
  }
};

/* ================= المستويات والخبرة ================= */
const LVL_XP=[0,120,300,560,900,1350,1900,2600,3450,4450,5600];
const LVL_NM=['بادئ','ناشئ','منتظم','مثابر','ملتزم','متمكّن','محترف','خبير','قدوة','أسطورة','نَسَقيّ'];
function levelOf(xp){let n=0;for(let i=0;i<LVL_XP.length;i++)if(xp>=LVL_XP[i])n=i;
  const cur=LVL_XP[n],next=LVL_XP[n+1]??(cur+1400);
  return{n:n+1,name:LVL_NM[Math.min(n,LVL_NM.length-1)],cur,next,prog:clamp((xp-cur)/(next-cur),0,1)};}
if(!S.cnt)S.cnt={habitDone:0,taskDone:0,focusSess:0,focusMin:0,journal:0};
function addXP(n,quiet){const before=levelOf(S.xp).n;S.xp=Math.max(0,S.xp+n);
  const L=levelOf(S.xp);
  if(L.n>before){SFX.level();Confetti.burst(innerWidth/2,innerHeight*.3,90);
    toast('مستوى جديد: '+L.name,'star');}
  else if(n>0&&!quiet)toast('+'+n+' نقطة','bolt');
  save();}

 {id:'c100',n:'مئة إتمام',d:'١٠٠ إتمام للعادات',i:'star',xp:80,t:()=>S.cnt.habitDone>=100},
 {id:'c500',n:'خمسمئة',d:'٥٠٠ إتمام للعادات',i:'star',xp:250,t:()=>S.cnt.habitDone>=500},
 {id:'t25',n:'منجز المهام',d:'أنجز ٢٥ مهمة',i:'tasks',xp:60,t:()=>S.cnt.taskDone>=25},

 {id:'p7',n:'عقد كامل',d:'٧ أيام مكتملة',i:'beads',xp:150,t:()=>Object.keys(S.perfect).length>=7},
 {id:'eb',n:'طير الفجر',d:'إتمام قبل السادسة صباحًا',i:'sunrise',xp:30,t:()=>!!S.meta.early},

 {id:'g1',n:'هدف محقق',d:'حقّق هدفًا كاملًا',i:'target',xp:100,t:()=>S.goals.some(g=>g.done)},
 {id:'j7',n:'مدوّن',d:'٧ تدوينات يومية',i:'journal',xp:50,t:()=>S.cnt.journal>=7},

 {id:'l10',n:'أسطورة نَسَق',d:'بلغت المستوى ١٠',i:'trophy',xp:0,t:()=>levelOf(S.xp).n>=10}];
function checkAch(){let delay=0;
  for(const a of ACH){if(S.ach[a.id])continue;let ok=false;try{ok=a.t();}catch(e){}
    if(ok){S.ach[a.id]=Date.now();
      setTimeout(()=>{SFX.fanfare();toast('إنجاز جديد: '+a.n,'trophy');},600+delay);delay+=1200;
      if(a.xp)addXP(a.xp,true);}}
  save();}

/* ================= عمليات العادات ================= */
const habitById=id=>S.habits.find(h=>h.id===id);
function setHabitCount(id,k,val){const h=habitById(id);if(!h)return;
  const was=habitFulfilled(h,S.habitLog,k);
  if(!S.habitLog[k])S.habitLog[k]={};
  S.habitLog[k][id]=Math.max(0,val);
  if(S.habitLog[k][id]===0)delete S.habitLog[k][id];
  const now=habitFulfilled(h,S.habitLog,k);
  if(now&&!was){S.cnt.habitDone++;const hr=new Date().getHours();
    if(hr<6)S.meta.early=true;if(hr>=23)S.meta.night=true;
    SFX.done();addXP(10,true);checkPerfect(k);checkAch();}
  else if(!now&&was){S.cnt.habitDone=Math.max(0,S.cnt.habitDone-1);S.xp=Math.max(0,S.xp-10);SFX.undo();
    if(S.perfect[k]&&k===todayKey()){delete S.perfect[k];S.xp=Math.max(0,S.xp-25);}}
  else if(val>0&&h.type==='count')SFX.count();
  save();}

  else{t.doneAt=null;S.cnt.taskDone=Math.max(0,S.cnt.taskDone-1);S.xp=Math.max(0,S.xp-8);SFX.undo();}

function taskGroups(){const t=todayKey();
  const open=S.tasks.filter(x=>!x.done);
  const g={overdue:[],today:[],week:[],later:[],someday:[]};
  for(const x of open){
    if(!x.due)g.someday.push(x);
    else{const d=diffDays(t,x.due);
      if(d<0)g.overdue.push(x);else if(d===0)g.today.push(x);
      else if(d<=7)g.week.push(x);else g.later.push(x);}}
  const byDue=(a,b)=>(a.due||'9')<(b.due||'9')?-1:1;
  g.overdue.sort(byDue);g.week.sort(byDue);g.later.sort(byDue);
  g.today.sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
  g.done=S.tasks.filter(x=>x.done).sort((a,b)=>b.doneAt-a.doneAt).slice(0,30);
  return g;}

/* ================= مؤقّت التركيز ================= */
const FT={phase:'work',running:false,endsAt:0,leftMs:0,round:1,task:null,int:0,lastSec:-1,
  len(p){return (p==='work'?S.focus.work:p==='short'?S.focus.short:S.focus.long)*60000;},
  init(){this.leftMs=this.len(this.phase);},
  wl:null,
  async wlOn(){try{if('wakeLock'in navigator&&!this.wl){this.wl=await navigator.wakeLock.request('screen');
    this.wl.addEventListener('release',()=>{this.wl=null;});}}catch(e){}},
  wlOff(){try{if(this.wl)this.wl.release();}catch(e){}this.wl=null;},
  start(){AU.ensure();this.running=true;this.endsAt=Date.now()+this.leftMs;SFX.start();ambSyncAll();this.wlOn();
    clearInterval(this.int);this.int=setInterval(()=>this.tick(),250);this.tick();},
  pause(){this.running=false;this.leftMs=Math.max(0,this.endsAt-Date.now());
    clearInterval(this.int);SFX.pause();ambSyncAll();this.wlOff();FT.paint();},
  reset(){this.pause();this.leftMs=this.len(this.phase);this.paint();},
  skip(){this.pause();this.phaseEnd(true);},
  tick(){if(!this.running)return;
    this.leftMs=this.endsAt-Date.now();
    const sec=Math.ceil(this.leftMs/1000);
    if(sec!==this.lastSec){this.lastSec=sec;
      if(S.focus.tick&&this.phase==='work'&&sec>0)SFX.tick();
      this.paint();}
    if(this.leftMs<=0)this.phaseEnd(false);},
  phaseEnd(skipped){clearInterval(this.int);this.running=false;ambSyncAll();this.wlOff();
    if(!skipped){SFX.bellEnd();
      notify(this.phase==='work'?'انتهت جلسة التركيز':'انتهت الاستراحة',
             this.phase==='work'?'خذ نفسًا… حان وقت الاستراحة':'عُد إلى نَسَقك، جلسة جديدة بانتظارك');}
    if(this.phase==='work'&&!skipped){
      const t=todayKey(),m=S.focus.work;
      S.focus.log[t]=(S.focus.log[t]||0)+m;
      S.focus.sess[t]=(S.focus.sess[t]||0)+1;
      S.cnt.focusMin+=m;S.cnt.focusSess++;addXP(15,true);checkAch();}
    if(this.phase==='work'){
      this.phase=(this.round>=S.focus.rounds)?'long':'short';}
    else{if(this.phase==='long')this.round=1;else this.round++;
      this.phase='work';}
    this.leftMs=this.len(this.phase);save();
    if(S.focus.autoNext&&!skipped)this.start();else this.paint();
    if(TAB==='focus'&&!SUB)renderFocus();},
  fmt(){const s=Math.max(0,Math.ceil(this.leftMs/1000));
    return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},
  paint(){const base=this._title||(this._title=document.title);
    document.title=this.running?this.fmt()+' · نَسَق':base;
    const el=$('#ft-time');if(!el)return;
    el.textContent=this.fmt();
    const total=this.len(this.phase),p=1-this.leftMs/total;
    const ring=$('#ft-ring');if(ring){const C=+ring.dataset.c;
      ring.style.strokeDashoffset=C*(1-p);}
    const fr=$('#fring');if(fr){fr.classList.toggle('run',this.running);
      fr.classList.toggle('work',this.phase==='work');
      fr.classList.toggle('break',this.phase!=='work');}
    const ph=$('#ft-phase');if(ph)ph.textContent=this.phase==='work'?'تركيز':(this.phase==='short'?'استراحة قصيرة':'استراحة طويلة');
    const pb=$('#ft-main');if(pb)pb.innerHTML=ic(this.running?'pause':'play');
    const doneR=this.round-1+(this.phase!=='work'?1:0);
    $$('#ft-rounds i').forEach((d,i)=>{d.classList.toggle('y',i<doneR);
      d.classList.toggle('cur',i===this.round-1&&this.phase==='work');});}
};

const BR={on:false,to:0,step:0,pat:[['شهيق',4,'in'],['احبس',4,'hold'],['زفير',4,'out'],['اثبت',4,'hold']],

<script>
/* ================= أدوات رسم ================= */
function ringSVG(size,stroke,pct,id){const r=(size-stroke)/2,C=2*Math.PI*r;

function heatHTML(habit,weeks){const t=todayKey(),ws=S.settings.weekStart;
  let start=addDays(weekStartOf(t,ws),-(weeks-1)*7),html='<div class="heat">',k=start;
  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){

    k=addDays(k,1);}
  return html+'</div><div class="heat-leg"><span>أقل</span><i style="background:var(--heat0)"></i><i class="l1" style="background:color-mix(in srgb,var(--basil) 30%,var(--heat0))"></i><i style="background:color-mix(in srgb,var(--basil) 55%,var(--heat0))"></i><i style="background:color-mix(in srgb,var(--basil) 78%,var(--heat0))"></i><i style="background:var(--basil)"></i><span>أكثر</span></div>';}

function drawBars(sel,labels,vals,opt){requestAnimationFrame(()=>{
  const c=$(sel);if(!c)return;opt=opt||{};
  const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const css=getComputedStyle(document.body);
  const ink3=css.getPropertyValue('--ink3').trim(),line=css.getPropertyValue('--line2').trim();
  const col=opt.color||css.getPropertyValue('--gold').trim();
  const padB=20,padT=16,max=Math.max(opt.max||0,...vals,1);
  const n=vals.length,gap=6,bw=Math.min(26,(W-gap*(n+1))/n);
  const x0=W-gap; // نبدأ من اليمين (RTL)
  x.strokeStyle=line;x.lineWidth=1;x.beginPath();x.moveTo(0,H-padB+.5);x.lineTo(W,H-padB+.5);x.stroke();
  x.textAlign='center';
  for(let i=0;i<n;i++){
    const bx=x0-(i+1)*(bw+gap)+gap,v=vals[i],bh=Math.max(2,(H-padB-padT)*(v/max));
    const y=H-padB-bh;
    x.fillStyle=opt.today===i?css.getPropertyValue('--basil').trim():col;
    x.beginPath();
    const r=Math.min(5,bw/2);
    x.roundRect(bx,y,bw,bh,[r,r,0,0]);x.fill();
    x.fillStyle=ink3;x.font='700 8.5px '+css.getPropertyValue('--f-body');
    x.fillText(labels[i]||'',bx+bw/2,H-7);
    if(v>0&&opt.showVals!==false){x.font='800 9px '+css.getPropertyValue('--f-disp');
      x.fillText(opt.fmt?opt.fmt(v):Math.round(v),bx+bw/2,y-4);}}
});}

/* ================= شاشة اليوم ================= */
function todayItems(){const k=todayKey();
  const po={morning:0,noon:1,evening:2,any:3};
  const habs=S.habits.filter(h=>habitScheduledOn(h,k))
    .sort((a,b)=>(po[a.period]??3)-(po[b.period]??3));
  const doneToday=t=>t.done&&t.doneAt&&dkey(new Date(t.doneAt))===k;
  const tasks=S.tasks.filter(t=>(!t.done&&t.due&&t.due<=k)||doneToday(t))
    .sort((a,b)=>(a.done?1:0)-(b.done?1:0)||((a.time||'99')<(b.time||'99')?-1:1));
  return{habs,tasks,k};}
RENDER.today=function(){const {habs,tasks,k}=todayItems();
  const doneH=habs.filter(h=>habitFulfilled(h,S.habitLog,k)).length;
  const doneT=tasks.filter(t=>t.done).length;
  const totalBeads=habs.length+tasks.length;
  const doneBeads=doneH+tasks.filter(t=>t.done).length;

   '<div class="stat"><div class="sl">'+ic('flame')+'أيام مكتملة</div><div class="sv num">'+Object.keys(S.perfect).length+'</div></div></div>'+

   (tasks.length?tasks.map(taskRow).join(''):'<div class="card flat empty" style="padding:22px"><b>لا مهام مستحقة</b><p>يومك صافٍ — أضف مهمة أو استمتع بالإنجاز</p></div>')+'</div>'+

/* ================= شاشة العادات ================= */
RENDER.habits=function(){const k=todayKey();
  const act=S.habits.filter(h=>!h.archived);
  const due=act.filter(h=>habitScheduledOn(h,k));
  const rest=act.filter(h=>!habitScheduledOn(h,k));
  const arch=S.habits.filter(h=>h.archived);
  const byP=p=>due.filter(h=>(h.period||'any')===p);
  const secs=PERIODS.map(([pid,pname])=>{const list=byP(pid);
    return list.length?'<div class="sect"><div class="s-t">'+ic(pid==='morning'?'sunrise':pid==='noon'?'sunn':pid==='evening'?'moon':'clock')+pname+'</div>'+list.map(h=>habitRow(h,k)).join('')+'</div>':'';}).join('');
  $('#scr-habits').innerHTML=
  '<div class="top"><div><div class="tt">العادات</div><div class="ts">'+act.length+' عادة نشطة · '+Object.keys(S.perfect).length+' يومًا مكتملًا</div></div>'+
  '<div class="top-acts"><button class="icobtn gold" data-act="templates" aria-label="قوالب جاهزة">'+ic('sparkle')+'</button></div></div>'+
  (act.length?secs+
    (rest.length?'<div class="sect"><div class="s-t">'+ic('calendar')+'غير مجدولة اليوم</div>'+rest.map(h=>habitRow(h,k)).join('')+'</div>':'')
  :'<div class="empty"><div class="ei">'+ic('leaf')+'</div><b>ابدأ أول عادة</b><p>عادة صغيرة تُتقنها كل يوم، خيرٌ من خطة كبيرة تُهجر.<br>جرّب القوالب الجاهزة لبداية سريعة.</p>'+
   '<div style="display:flex;gap:9px;justify-content:center;margin-top:16px"><button class="btn gold sm" data-act="templates">'+ic('sparkle')+'قوالب جاهزة</button>'+
   '<button class="btn soft sm" data-act="new-habit">'+ic('plus')+'عادة جديدة</button></div></div>')+
  (arch.length?'<div class="sect"><button class="btn ghost wide" data-act="go-archive">'+ic('archive')+'الأرشيف ('+arch.length+')</button></div>':'');
};

/* ---- تفاصيل عادة ---- */
function openHabitDetail(id){openSub(()=>{const h=habitById(id);
  if(!h){Layers.back();return;}
  const t=todayKey(),ws=S.settings.weekStart;
  const st=habitStreak(h,S.habitLog,t,ws),best=habitBestStreak(h,S.habitLog,t,ws);
  const r30=Math.round(habitRate(h,S.habitLog,addDays(t,-29),t)*100);
  let total=0;for(const day in S.habitLog)if(habitFulfilled(h,S.habitLog,day))total++;
  const wlabels=[],wvals=[];
  for(let i=7;i>=0;i--){const to=addDays(t,-i*7),from=addDays(to,-6);
    wvals.push(Math.round(habitRate(h,S.habitLog,from,to)*100));wlabels.push(fromKey(to).getDate()+'/'+(fromKey(to).getMonth()+1));}
  $('#scr-sub').innerHTML=subHead(h.name,
    '<button class="icobtn" data-act="edit-habit" data-id="'+h.id+'">'+ic('pen')+'</button>')+
  '<div class="card" style="display:flex;gap:14px;align-items:center;--hc:'+h.color+'">'+
   '<div class="hic" style="width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,'+h.color+' 16%,transparent);color:'+h.color+'">'+ic(h.icon)+'</div>'+
   '<div style="flex:1"><b style="font-size:16px">'+esc(h.name)+'</b>'+
   '<div class="hmeta" style="margin-top:5px"><span class="chip">'+(h.freq.kind==='daily'?'يوميًا':h.freq.kind==='weekly'?h.freq.times+' مرات أسبوعيًا':h.freq.days.map(d=>WD_S[d]).join('، '))+'</span>'+
   (h.type==='count'?'<span class="chip azure">'+h.target+' '+esc(h.unit||'مرة')+'</span>':'')+
   (h.reminder?'<span class="chip gold">'+ic('alarm')+h.reminder+'</span>':'')+'</div></div>'+
   habitControl(h,t)+'</div>'+
  '<div class="card sect" style="--hc:'+h.color+'"><div class="card-h"><h3>'+ic('calendar')+'تسجيل الأيام الماضية</h3></div>'+
  '<div class="d7">'+[6,5,4,3,2,1,0].map(i=>{const kk=addDays(t,-i);
    const sch=(h.freq.kind==='days'?h.freq.days.includes(weekdayOf(kk)):true);
    const y=sch&&habitFulfilled(h,S.habitLog,kk);
    return '<button class="dc'+(y?' y':'')+(kk===t?' tod':'')+'"'+(sch?'':' disabled')+' data-act="hpast" data-id="'+h.id+'" data-k="'+kk+'"><b>'+fromKey(kk).getDate()+'</b><span>'+WD_MIN[weekdayOf(kk)]+'</span></button>';}).join('')+'</div>'+
  '<p class="faint" style="font-size:10.5px;margin-top:9px">فاتك يوم؟ المسه لتعليمه'+(h.type==='count'?' مكتملًا بهدفه':'')+' — الباهت غير مجدول</p></div>'+
  '<div class="statgrid sect">'+
   '<div class="stat"><div class="sl">'+ic('flame')+'السلسلة</div><div class="sv num">'+st+'<small>'+(h.freq.kind==='weekly'?'أسبوع':'يوم')+'</small></div></div>'+
   '<div class="stat"><div class="sl">'+ic('trophy')+'الأفضل</div><div class="sv num">'+best+'</div></div>'+
   '<div class="stat"><div class="sl">'+ic('chart')+'آخر ٣٠ يوم</div><div class="sv num">'+r30+'<small>٪</small></div></div>'+
   '<div class="stat"><div class="sl">'+ic('check')+'الإجمالي</div><div class="sv num">'+total+'</div></div></div>'+
  '<div class="card sect"><div class="card-h"><h3>'+ic('calendar')+'خريطة الالتزام — ١٦ أسبوعًا</h3></div>'+heatHTML(h,16)+'</div>'+
  '<div class="card sect"><div class="card-h"><h3>'+ic('chart')+'نسبة الالتزام أسبوعيًا</h3></div><canvas class="chart-c" id="hd-bars"></canvas></div>'+
  (h.notes?'<div class="card sect"><div class="card-h"><h3>'+ic('journal')+'ملاحظة</h3></div><p style="font-size:13.5px;color:var(--ink2)">'+esc(h.notes)+'</p></div>':'')+
  '<div class="sect" style="display:grid;gap:9px">'+
   '<button class="btn soft wide" data-act="archive-habit" data-id="'+h.id+'">'+ic('archive')+(h.archived?'إلغاء الأرشفة':'أرشفة العادة')+'</button>'+
   '<button class="btn danger wide" data-act="del-habit" data-id="'+h.id+'">'+ic('trash')+'حذف العادة نهائيًا</button></div>';
  drawBars('#hd-bars',wlabels,wvals,{max:100,fmt:v=>v+'٪',color:h.color});
});}

/* ================= شاشة المهام ================= */
let TASKVIEW='list',DONE_OPEN=false,TASKQ='',TASKTAG=null;
function tasksBody(){const F=a=>filterTasks(a,TASKQ,TASKTAG);
  if(TASKVIEW==='matrix'){
    const open=F(S.tasks.filter(t=>!t.done));
    const q=(imp,urg)=>open.filter(t=>!!t.pr.imp===imp&&!!t.pr.urg===urg);
    const cell=t=>'<button class="mt" data-act="tedit" data-id="'+t.id+'"><i>'+ic('check')+'</i><span>'+esc(t.title)+'</span></button>';
    const quad=(cls,icn,tt,dd,arr)=>'<div class="quad '+cls+'"><h4>'+ic(icn)+tt+'</h4><div class="qd">'+dd+'</div>'+(arr.length?arr.map(cell).join(''):'<div class="faint" style="font-size:11px">فارغ</div>')+'</div>';
    return '<div class="matrix">'+
      quad('q1','flame','مهم وعاجل','افعلها الآن',q(true,true))+
      quad('q2','star','مهم غير عاجل','خطّط لها — هنا يُصنع الفرق',q(true,false))+
      quad('q3','bolt','عاجل غير مهم','بسّطها أو فوّضها',q(false,true))+
      quad('q4','moon','لا هذا ولا ذاك','قلّلها ما استطعت',q(false,false))+'</div>'+
      '<p class="faint" style="font-size:11px;margin-top:10px;text-align:center">اضغط أي مهمة لتعديل تصنيفها من حقلَي «مهم» و«عاجل»</p>';}
  const g=taskGroups();
  for(const key of ['overdue','today','week','later','someday','done'])g[key]=F(g[key]);
  const openF=g.overdue.length+g.today.length+g.week.length+g.later.length+g.someday.length;
  const sec=(title,arr,icn,cls)=>arr.length?'<div class="sect"><div class="s-t" '+(cls?'style="color:var(--'+cls+')"':'')+'>'+ic(icn)+title+' · '+arr.length+'</div>'+arr.map(taskRow).join('')+'</div>':'';
  let body=sec('متأخرة',g.overdue,'flame','clay')+sec('اليوم',g.today,'sunrise')+
    sec('هذا الأسبوع',g.week,'calendar')+sec('لاحقًا',g.later,'clock')+sec('بلا تاريخ',g.someday,'list');
  if(!openF&&!g.done.length){
    body=(TASKQ||TASKTAG)
    ?'<div class="empty" style="padding:34px 18px"><div class="ei">'+ic('search')+'</div><b>لا نتائج مطابقة</b><p>جرّب كلمة أخرى أو ألغِ التصفية</p></div>'
    :'<div class="empty"><div class="ei">'+ic('tasks')+'</div><b>لا مهام مفتوحة</b><p>أضف مهمة من الشريط أعلاه — اكتب «غدًا» لتحديد الموعد تلقائيًا،<br>و «!» للعاجل و «*» للمهم.</p></div>';}
  if(g.done.length)body+='<div class="sect"><div style="display:flex;align-items:center;gap:6px">'+
    '<button class="s-t" data-act="toggle-done" style="flex:1;background:none;border:0;cursor:pointer;text-align:start;margin:0;padding:0">'+ic(DONE_OPEN?'chevD':'back')+'المكتملة · '+g.done.length+'</button>'+
    '<button class="icobtn sm" data-act="clear-done" aria-label="حذف كل المكتملة">'+ic('trash')+'</button></div>'+
    (DONE_OPEN?g.done.map(taskRow).join(''):'')+'</div>';
  return body;}
RENDER.tasks=function(){const openCount=S.tasks.filter(t=>!t.done).length;
  const seg='<div class="seg" style="margin-bottom:14px">'+
    '<button class="'+(TASKVIEW==='list'?'on':'')+'" data-act="tview" data-v="list">'+ic('list')+'قائمة</button>'+
    '<button class="'+(TASKVIEW==='matrix'?'on':'')+'" data-act="tview" data-v="matrix">'+ic('matrix')+'مصفوفة الأولويات</button></div>';
  const qa='<div class="card flat" style="padding:9px;display:flex;gap:8px;margin-bottom:10px">'+
    '<input class="inp" id="qadd" placeholder="أضف مهمة سريعة… جرّب: مراجعة التقرير غدًا !" style="border:0;background:transparent;padding:8px 6px">'+
    '<button class="btn gold sm" data-act="qadd" style="border-radius:11px">'+ic('plus')+'</button></div>';
  const ctr='<div class="card flat" style="padding:8px 12px;display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--ink3)">'+ic('search')+
    '<input class="inp" id="tsearch" placeholder="ابحث في مهامك…" value="'+esc(TASKQ)+'" style="border:0;background:transparent;padding:6px 0;flex:1">'+
    '<button class="icobtn sm" data-act="tq-clear" id="tq-clear"'+(TASKQ?'':' hidden')+'>'+ic('close')+'</button></div>'+
    '<div class="chips" style="margin-bottom:14px">'+
    '<button class="'+(TASKTAG?'':'on')+'" data-act="tfilter" data-t="">الكل</button>'+
    S.tags.map(tg=>'<button class="'+(TASKTAG===tg.id?'on':'')+'" data-act="tfilter" data-t="'+tg.id+'">'+esc(tg.name)+'</button>').join('')+'</div>';
  $('#scr-tasks').innerHTML='<div class="top"><div><div class="tt">المهام</div><div class="ts">'+openCount+' مهمة مفتوحة</div></div></div>'+qa+ctr+seg+'<div id="tasks-body">'+tasksBody()+'</div>';
  const inp=$('#qadd');
  if(inp)inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){quickAdd(inp.value);inp.value='';rerender();}};
  const ts=$('#tsearch');
  if(ts)ts.oninput=()=>{TASKQ=ts.value;const b=$('#tasks-body');if(b)b.innerHTML=tasksBody();
    const cl=$('#tq-clear');if(cl)cl.hidden=!TASKQ;};
};

/* ================= بطاقة مشاركة اليوم ================= */
function roundR(x,a,b,w,hh,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+hh,r);
  x.arcTo(a+w,b+hh,a,b+hh,r);x.arcTo(a,b+hh,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function wrapTxt(x,txt,cx,y,maxW,lh){const words=txt.split(' ');let line='';
  for(const w of words){const t=line?line+' '+w:w;
    if(x.measureText(t).width>maxW&&line){x.fillText(line,cx,y);y+=lh;line=w;}else line=t;}
  if(line)x.fillText(line,cx,y);return y;}
async function shareDay(){const k=todayKey();
  try{if(document.fonts)await document.fonts.ready;}catch(e){}
  const {habs,tasks}=todayItems();
  const doneH=habs.filter(hb=>habitFulfilled(hb,S.habitLog,k)).length;
  const doneT=tasks.filter(t=>t.done).length;
  const total=habs.length+tasks.length,done=doneH+doneT;
  const best=S.habits.length?Math.max(0,...S.habits.map(hb=>habitStreak(hb,S.habitLog,k,S.settings.weekStart))):0;
  const mins=S.focus.log[k]||0;
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#0E1613';x.fillRect(0,0,W,H);
  x.globalAlpha=.05;
  for(let i=0;i<900;i++){x.fillStyle=i%2?'#fff':'#000';x.fillRect(Math.random()*W,Math.random()*H,1.7,1.7);}
  x.globalAlpha=1;
  x.strokeStyle='rgba(233,180,76,.4)';x.lineWidth=3;x.strokeRect(38,38,W-76,H-76);
  x.strokeStyle='rgba(233,180,76,.13)';x.lineWidth=2;x.strokeRect(56,56,W-112,H-112);
  const gold='#E9B44C',ink='#EDEDE6',ink3='#8A9590';
  x.textAlign='center';try{x.direction='rtl';}catch(e){}
  x.fillStyle=gold;x.font='800 96px Alexandria';x.fillText('نَسَق',W/2,200);
  x.fillStyle=ink3;x.font='600 30px PlexAr';
  x.fillText(fmtDate(k)+(hijriToday()?'  ·  '+hijriToday():''),W/2,262);
  const y0=400;
  x.strokeStyle=done===total&&total?'rgba(233,180,76,.85)':'rgba(51,71,60,.9)';
  x.lineWidth=4;x.beginPath();x.moveTo(130,y0);x.lineTo(W-130,y0);x.stroke();
  const n=Math.max(total,5),span=W-340;
  for(let i=0;i<n;i++){const cx=170+span*(n===1?.5:i/(n-1));
    const filled=total>0&&i<done;
    x.beginPath();x.arc(cx,y0,total>0?20:14,0,7);
    x.fillStyle=filled?gold:'#1C2A24';x.fill();
    x.lineWidth=3;x.strokeStyle=filled?'rgba(246,208,128,.95)':'#33473C';x.stroke();}
  x.fillStyle=ink;x.font='800 60px Alexandria';x.fillText(done+' / '+total,W/2,y0+118);
  x.fillStyle=ink3;x.font='600 28px PlexAr';x.fillText('سُبحة اليوم',W/2,y0+164);
  const cards=[[doneH+'/'+habs.length,'عادات اليوم'],[String(best),'أطول سلسلة'],[fmtMin(mins),'تركيز اليوم']];
  const cw=(W-160-80)/3;let sx=80;const sy=680;
  for(const [v,l] of cards){
    x.fillStyle='#17231F';roundR(x,sx,sy,cw,190,26);x.fill();
    x.strokeStyle='#243830';x.lineWidth=2;roundR(x,sx,sy,cw,190,26);x.stroke();
    x.fillStyle=gold;x.font='800 54px Alexandria';x.fillText(v,sx+cw/2,sy+96);
    x.fillStyle=ink3;x.font='700 27px PlexAr';x.fillText(l,sx+cw/2,sy+150);
    sx+=cw+40;}
  x.fillStyle=ink;x.font='600 36px Alexandria';
  wrapTxt(x,'«'+QUOTES[Math.abs(diffDays('2026-01-01',k))%QUOTES.length]+'»',W/2,986,W-240,58);

   (notifState==='unsupported'?'<p class="faint" style="font-size:11.5px">جهازك لا يدعم إشعارات النظام — ستظهر التذكيرات داخل التطبيق فقط.</p>'

   :'<button class="btn soft sm" data-act="ask-notif">'+ic('bell')+'السماح بإشعارات النظام</button>')+'</div>'+

  '<div class="card sect"><div class="card-h"><h3>'+ic('calendar')+'عام</h3></div>'+

  (deferredPrompt?'<div class="sect"><button class="btn gold wide" data-act="install-app">'+ic('download')+'تثبيت «نَسَق» كتطبيق</button></div>':'')+

/* تصدير / استيراد / مسح */
function doExport(){const data=JSON.stringify(S);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='naasaq-backup-'+todayKey()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('صُدّرت النسخة الاحتياطية','download');}
function doImport(file){if(!file)return;const rd=new FileReader();
  rd.onload=async()=>{try{const obj=JSON.parse(rd.result);
    if(!obj||typeof obj!=='object'||!('habits'in obj))throw 0;
    if(await askConfirm('استيراد نسخة','سيُستبدل كل ما لديك الآن بمحتوى الملف. متابعة؟','استيراد')){
      S=Object.assign(DEF(),obj);save();toast('تم الاستيراد','check');
      setTimeout(()=>location.reload(),500);}
  }catch(e){toast('ملف غير صالح','ban');}};
  rd.readAsText(file);}
async function doWipe(){if(await askConfirm('مسح كل البيانات','سيُحذف كل شيء نهائيًا: العادات والمهام والأهداف والسجلّ. لا يمكن التراجع.','امسح كل شيء',true)){
  localStorage.removeItem(DB);S=DEF();save();toast('مُسحت البيانات','trash');
  setTimeout(()=>location.reload(),500);}}

/* ================= النماذج (أوراق سفلية) ================= */
function habitForm(h){const ed=!!h;h=h||{name:'',icon:'leaf',color:HB_COLORS[0],type:'check',target:1,unit:'مرة',
  freq:{kind:'daily',days:[0,1,2,3,4,5,6],times:3},period:'any',reminder:'',notes:''};
  const fk=h.freq.kind;
  openSheet('<h2>'+ic(ed?'pen':'plus')+(ed?'تعديل العادة':'عادة جديدة')+'</h2>'+
   '<div class="fld"><label>اسم العادة</label><input class="inp" id="h-name" value="'+esc(h.name)+'" placeholder="مثال: قراءة ٢٠ دقيقة" maxlength="40"></div>'+
   '<div class="fld"><label>الأيقونة</label><div class="iconpick" id="h-icons">'+HB_ICONS.map(i=>'<button class="'+(h.icon===i?'on':'')+'" data-i="'+i+'">'+ic(i)+'</button>').join('')+'</div></div>'+
   '<div class="fld"><label>اللون</label><div class="colorpick" id="h-colors">'+HB_COLORS.map(c=>'<button class="'+(h.color===c?'on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>').join('')+'</div></div>'+
   '<div class="fld"><label>النوع</label><div class="seg" id="h-type"><button class="'+(h.type==='check'?'on':'')+'" data-v="check">'+ic('check')+'إتمام</button><button class="'+(h.type==='count'?'on':'')+'" data-v="count">'+ic('plus')+'عدّاد</button></div></div>'+
   '<div id="h-count" class="row2 '+(h.type==='count'?'':'hide')+'"><div class="fld"><label>الهدف اليومي</label><input class="inp" type="number" id="h-target" min="1" max="99" value="'+h.target+'"></div>'+
    '<div class="fld"><label>الوحدة</label><input class="inp" id="h-unit" value="'+esc(h.unit||'مرة')+'" placeholder="كوب، صفحة…"></div></div>'+
   '<div class="fld"><label>التكرار</label><div class="seg" id="h-fk"><button class="'+(fk==='daily'?'on':'')+'" data-v="daily">يوميًا</button><button class="'+(fk==='days'?'on':'')+'" data-v="days">أيام محددة</button><button class="'+(fk==='weekly'?'on':'')+'" data-v="weekly">مرات أسبوعيًا</button></div></div>'+
   '<div id="h-days" class="fld '+(fk==='days'?'':'hide')+'"><div class="chips" id="h-daysel">'+WD_S.map((d,i)=>'<button class="'+((h.freq.days||[]).includes(i)?'on':'')+'" data-d="'+i+'">'+d+'</button>').join('')+'</div></div>'+
   '<div id="h-weekly" class="fld '+(fk==='weekly'?'':'hide')+'"><label>كم مرة في الأسبوع؟</label><input class="inp" type="number" id="h-times" min="1" max="7" value="'+(h.freq.times||3)+'"></div>'+
   '<div class="fld"><label>الفترة المفضّلة</label><div class="seg" id="h-period">'+PERIODS.map(([v,nm])=>'<button class="'+((h.period||'any')===v?'on':'')+'" data-v="'+v+'">'+nm+'</button>').join('')+'</div></div>'+
   '<div class="fld"><label>وقت التذكير (اختياري)</label><div style="display:flex;gap:8px"><input class="inp" type="time" id="h-rem" value="'+(h.reminder||'')+'" style="flex:1">'+(h.reminder?'<button class="btn soft sm" id="h-rem-clear">مسح</button>':'')+'</div></div>'+
   '<div class="fld"><label>ملاحظة (اختياري)</label><textarea class="inp" id="h-notes" placeholder="لماذا هذه العادة مهمة لك؟">'+esc(h.notes||'')+'</textarea></div>'+
   '<button class="btn gold wide" id="h-save" style="margin-top:8px">'+(ed?'حفظ التغييرات':'إنشاء العادة')+'</button>'+
   (ed?'<button class="btn danger wide" data-act="del-habit" data-id="'+h.id+'" style="margin-top:9px">'+ic('trash')+'حذف</button>':''),
  sh=>{
   let sel={icon:h.icon,color:h.color,type:h.type,fk,days:[...(h.freq.days||[0,1,2,3,4,5,6])],period:h.period||'any'};
   sh.querySelector('#h-icons').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;sel.icon=b.dataset.i;$$('#h-icons button').forEach(x=>x.classList.toggle('on',x===b));};
   sh.querySelector('#h-colors').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;sel.color=b.dataset.c;$$('#h-colors button').forEach(x=>x.classList.toggle('on',x===b));};
   sh.querySelector('#h-type').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;sel.type=b.dataset.v;$$('#h-type button').forEach(x=>x.classList.toggle('on',x===b));sh.querySelector('#h-count').classList.toggle('hide',sel.type!=='count');};
   sh.querySelector('#h-fk').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;sel.fk=b.dataset.v;$$('#h-fk button').forEach(x=>x.classList.toggle('on',x===b));
     sh.querySelector('#h-days').classList.toggle('hide',sel.fk!=='days');sh.querySelector('#h-weekly').classList.toggle('hide',sel.fk!=='weekly');};
   sh.querySelector('#h-daysel').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=+b.dataset.d;
     if(sel.days.includes(d))sel.days=sel.days.filter(x=>x!==d);else sel.days.push(d);b.classList.toggle('on');};
   sh.querySelector('#h-period').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;sel.period=b.dataset.v;$$('#h-period button').forEach(x=>x.classList.toggle('on',x===b));};
   const rc=sh.querySelector('#h-rem-clear');if(rc)rc.onclick=()=>{sh.querySelector('#h-rem').value='';};
   sh.querySelector('#h-save').onclick=()=>{const name=sh.querySelector('#h-name').value.trim();
     if(!name){toast('اكتب اسم العادة','info');SFX.error();return;}
     if(sel.fk==='days'&&!sel.days.length){toast('اختر يومًا واحدًا على الأقل','info');SFX.error();return;}
     const freq=sel.fk==='daily'?{kind:'daily'}:sel.fk==='days'?{kind:'days',days:sel.days.sort()}:{kind:'weekly',times:clamp(+sh.querySelector('#h-times').value||3,1,7)};
     const obj={name,icon:sel.icon,color:sel.color,type:sel.type,

       reminder:sh.querySelector('#h-rem').value||'',notes:sh.querySelector('#h-notes').value.trim()};
     if(ed){Object.assign(h,obj);toast('حُفظت التغييرات','check');}
     else{S.habits.push({id:uid(),...obj,archived:false,createdKey:todayKey(),createdAt:Date.now()});
       toast('أُنشئت العادة','leaf');SFX.done();}
     save();checkAch();closeSheet();rerender();};
  });}

function taskForm(t){const ed=!!t;t=t||{title:'',notes:'',due:null,time:null,pr:{imp:false,urg:false},tag:null,subs:[],repeat:'none'};
  openSheet('<h2>'+ic(ed?'pen':'plus')+(ed?'تعديل المهمة':'مهمة جديدة')+'</h2>'+
   '<div class="fld"><label>المهمة</label><input class="inp" id="t-title" value="'+esc(t.title)+'" placeholder="ماذا تريد أن تنجز؟" maxlength="120"></div>'+
   '<div class="row2"><div class="fld"><label>التاريخ</label><input class="inp" type="date" id="t-due" value="'+(t.due||'')+'"></div>'+
    '<div class="fld"><label>الوقت</label><input class="inp" type="time" id="t-time" value="'+(t.time||'')+'"></div></div>'+

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case'sub-back':Layers.back();break;
    case'go-ach':openAch();break;
    case'go-settings':openSettings();break;
    case'go-journal':openJournal();break;
    case'go-goals':openGoals();break;
    case'go-stats':openStats();break;
    case'go-archive':openArchive();break;
    case'beadgo':{const t=$('#'+el.dataset.t);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});
      t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),900);}SFX.tap();break;}
    case'htoggle':toggleHabit(id,todayKey());rerender();break;
    case'hplus':{const h=habitById(id);setHabitCount(id,todayKey(),habitCountOn(h,S.habitLog,todayKey())+1);rerender();break;}
    case'hminus':{const h=habitById(id);setHabitCount(id,todayKey(),habitCountOn(h,S.habitLog,todayKey())-1);rerender();break;}
    case'hopen':openHabitDetail(id);break;
    case'hpast':{const kk=el.dataset.k,hh=habitById(id);
      if(hh&&hh.createdKey&&kk<hh.createdKey)hh.createdKey=kk;
      toggleHabit(id,kk);RENDER._sub&&RENDER._sub();break;}
    case'fquick':{const m=+el.dataset.m;S.focus.work=m;save();
      if(!FT.running&&FT.phase==='work')FT.leftMs=FT.len('work');
      SFX.tap();renderFocus();break;}
    case'templates':templatesSheet();break;
    case'new-habit':habitForm();break;
    case'edit-habit':{const h=habitById(id);const w=sheetOpen();if(w)closeSheet();setTimeout(()=>habitForm(h),w?90:0);break;}
    case'archive-habit':{const h=habitById(id);h.archived=!h.archived;save();SFX.tap();
      toast(h.archived?'أُرشفت العادة':'أُعيدت العادة',h.archived?'archive':'refresh');
      if(SUB&&!h.archived){}rerender();break;}
    case'del-habit':{const h=habitById(id);if(!h)break;
      if(await askConfirm('حذف العادة','سيُحذف «'+h.name+'» وكل سجلّه نهائيًا. متابعة؟','حذف',true)){
        S.habits=S.habits.filter(x=>x.id!==id);
        for(const day in S.habitLog)if(S.habitLog[day])delete S.habitLog[day][id];
        save();SFX.del();toast('حُذفت العادة','trash');
        if(sheetOpen())closeSheet();if(SUB)Layers.back();else rerender();}break;}
    case'tview':TASKVIEW=el.dataset.v;rerender();break;
    case'tfilter':TASKTAG=el.dataset.t||null;rerender();break;
    case'tq-clear':TASKQ='';rerender();break;
    case'clear-done':{const nn=S.tasks.filter(t=>t.done).length;if(!nn)break;
      if(await askConfirm('حذف المكتملة','سيُحذف '+nn+' من المهام المكتملة نهائيًا. متابعة؟','حذف',true)){
        S.tasks=S.tasks.filter(t=>!t.done);save();SFX.del();toast('حُذفت المكتملة','trash');rerender();}break;}
    case'share-day':shareDay();break;
    case'immersive':{const on=document.body.classList.toggle('immersive');
      try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
        else if(!on&&document.exitFullscreen)document.exitFullscreen();}catch(e){}
      SFX.tap();break;}
    case'qadd':{const inp=$('#qadd');if(inp&&inp.value.trim()){quickAdd(inp.value);inp.value='';rerender();}break;}
    case'ttoggle':toggleTask(id);rerender();break;
    case'stoggle':toggleSub(id,el.dataset.sid);rerender();break;
    case'tedit':{const t=taskById(id);taskForm(t);break;}
    case'del-task':{const t=taskById(id);if(!t)break;
      if(await askConfirm('حذف المهمة','حذف «'+t.title+'»؟','حذف',true)){
        S.tasks=S.tasks.filter(x=>x.id!==id);save();SFX.del();toast('حُذفت المهمة','trash');if(sheetOpen())closeSheet();rerender();}break;}
    case'toggle-done':DONE_OPEN=!DONE_OPEN;rerender();break;
    case'mood':setMood(todayKey(),+el.dataset.v);rerender();break;
    case'go-focus-start':goTab('focus');if(!FT.running)setTimeout(()=>FT.start(),200);break;
    case'fmode':{FOCUSMODE=el.dataset.v;if(FOCUSMODE!=='breath')BR.stop();renderFocus();break;}
    case'ft-main':FT.running?FT.pause():FT.start();break;
    case'ft-reset':FT.reset();break;
    case'ft-skip':FT.skip();break;
    case'focus-settings':focusSettingsSheet();break;
    case'fs-save':{S.focus.work=clamp(+$('#fs-w').value||25,1,120);S.focus.short=clamp(+$('#fs-s').value||5,1,60);
      S.focus.long=clamp(+$('#fs-l').value||15,5,90);S.focus.rounds=clamp(+$('#fs-r').value||4,2,8);if(FT.round>S.focus.rounds)FT.round=S.focus.rounds;
      S.focus.autoNext=$('#fs-a').checked;S.focus.tick=$('#fs-t').checked;save();
      if(!FT.running){FT.leftMs=FT.len(FT.phase);}closeSheet();toast('حُفظت الإعدادات','check');renderFocus();break;}
    case'br-pat':{if(el.dataset.v==='478')BR.set478();else BR.setBox();if(BR.on)BR.start();renderFocus();break;}
    case'br-toggle':{if(BR.on){BR.stop();}else{BR.start();}renderFocus();break;}
    case'new-goal':goalForm();break;
    case'goal-open':openGoalDetail(id);break;
    case'edit-goal':{const g=S.goals.find(x=>x.id===id);const w=sheetOpen();if(w)closeSheet();setTimeout(()=>goalForm(g),w?90:0);break;}
    case'mile':toggleMile(el.dataset.g,el.dataset.m);RENDER._sub&&RENDER._sub();break;
    case'del-goal':{const g=S.goals.find(x=>x.id===id);if(!g)break;
      if(await askConfirm('حذف الهدف','حذف «'+g.title+'» ومراحله؟','حذف',true)){
        S.goals=S.goals.filter(x=>x.id!==id);save();SFX.del();toast('حُذف الهدف','trash');
        if(sheetOpen())closeSheet();if(SUB)Layers.back();break;}break;}
    case'set-theme':S.settings.theme=el.dataset.v;save();applyTheme();$$('#scr-sub [data-act="set-theme"]').forEach(b=>b.classList.toggle('on',b.dataset.v===el.dataset.v));SFX.tap();break;
    case'set-wstart':S.settings.weekStart=+el.dataset.v;save();$$('#scr-sub [data-act="set-wstart"]').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.settings.weekStart));SFX.tap();rerender();break;
    case'try-sound':AU.ensure();SFX.done();break;
    case'ask-notif':{if('Notification'in window){const p=await Notification.requestPermission();
      if(p==='granted'){toast('تم تفعيل الإشعارات','bell');notify('نَسَق','ستصلك التذكيرات هنا');}else toast('لم يُمنح الإذن','info');openSettings.refresh&&openSettings.refresh();RENDER._sub&&RENDER._sub();}break;}
    case'export':doExport();break;
    case'import':$('#import-file').click();break;
    case'wipe':doWipe();break;
    case'install-app':if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;$('#bnInstall').classList.remove('on');}break;
  }
});

/* ================= الإعداد الأولي (Onboarding) ================= */
let onbStep=0,onbName='',onbTmpl=new Set();
function onboarding(){const steps=[
  ()=>'<div class="ob-logo"><img src="assets/icon-192.png" alt=""></div><h2>نَسَق</h2><p>كل ما تحتاجه لبناء ذاتك في مكانٍ واحد — عاداتك، مهامك، تركيزك، وأهدافك. يعمل دون اتصال، ويحفظ كل شيء على جهازك.</p>',
  ()=>'<div class="ob-feats">'+[['leaf','عادات','بسلاسل وخرائط التزام تُبقيك على الطريق'],['tasks','مهام','بمصفوفة أولويات وتكرار وإضافة ذكية'],['timer','تركيز','بومودورو بأصوات محيطة مُصنّعة وتمارين تنفّس'],['target','أهداف','بمراحل تربطها بعاداتك اليومية']].map(f=>'<div class="obf"><div class="ic">'+ic(f[0])+'</div><div><b>'+f[1]+'</b><span>'+f[2]+'</span></div></div>').join('')+'</div>',
  ()=>'<div class="ob-logo"><div class="ic-big">'+ic('pen')+'</div></div><h2>كيف نناديك؟</h2><p>اسمك يظهر في ترحيب يومك (اختياري تمامًا).</p><input class="inp" id="onb-name" placeholder="اكتب اسمك" value="'+esc(onbName)+'" maxlength="24" style="text-align:center;margin-top:6px">',
  ()=>'<h2>لنبدأ بعادات</h2><p style="margin-bottom:4px">اختر ما يناسبك الآن — تعدّلها لاحقًا بحرية.</p><div class="tmpl" id="onb-tmpl">'+TEMPLATES.slice(0,10).map((t,i)=>'<button class="'+(onbTmpl.has(i)?'on':'')+'" data-i="'+i+'"><div class="ti">'+ic(t.i)+'</div><b>'+esc(t.n)+'</b></button>').join('')+'</div>'
  ];
  const last=steps.length-1;
  $('#onb').innerHTML='<div class="ob-card"><div class="ob-body">'+steps[onbStep]()+'</div>'+
   '<div class="ob-dots">'+steps.map((_,i)=>'<i class="'+(i===onbStep?'on':'')+'"></i>').join('')+'</div>'+
   '<div class="ob-nav">'+(onbStep<last?'<button class="btn ghost" id="onb-skip">تخطٍّ</button>':'<span></span>')+
   '<button class="btn gold" id="onb-next">'+(onbStep===last?'ابدأ رحلتي':'التالي')+'</button></div></div>';
  $('#onb').classList.add('on');
  const grid=$('#onb-tmpl');
  if(grid)grid.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i;
    if(onbTmpl.has(i))onbTmpl.delete(i);else onbTmpl.add(i);b.classList.toggle('on');};
  const skip=$('#onb-skip');if(skip)skip.onclick=()=>finishOnb();
  const nEl=$('#onb-name');if(nEl)nEl.onkeydown=e=>{if(e.key==='Enter')$('#onb-next').click();};
  $('#onb-next').onclick=()=>{
    if(onbStep===2){const n=$('#onb-name');if(n)onbName=n.value.trim();}
    if(onbStep===last)finishOnb();else{onbStep++;SFX.tap();onboarding();}};
}
function finishOnb(){if(onbName)S.name=onbName;
  onbTmpl.forEach(i=>{const t=TEMPLATES[i];
    S.habits.push({id:uid(),name:t.n,icon:t.i,color:HB_COLORS[t.c%HB_COLORS.length],
      type:t.type||'check',target:t.target||1,unit:t.unit||'مرة',freq:{kind:'daily'},
      period:t.period||'any',reminder:'',notes:'',archived:false,createdKey:todayKey(),createdAt:Date.now()});});
  S.meta.firstRun=false;S.meta.seenVer=APP_VERSION;save();checkAch();
  $('#onb').classList.remove('on');SFX.fanfare();
  Confetti.burst(innerWidth/2,innerHeight*.4,90);
  goTab('today');}

/* ================= Service Worker + التحديث + التثبيت ================= */
let deferredPrompt=null;
let updateSnoozed=false;
function maybeShowUpdate(){if(swReg&&swReg.waiting&&!updateSnoozed)$('#bnUpdate').classList.add('on');}
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting)maybeShowUpdate();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;
      nw&&nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller)maybeShowUpdate();});});
    setInterval(()=>{reg.update().catch(()=>{});},36e5);
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});
}
window.addEventListener('online',()=>{updateSnoozed=false;maybeShowUpdate();});
$('#bnUpdateGo').onclick=()=>{
  if(!navigator.onLine){SFX.error();toast('لا اتصال بالإنترنت — سيبقى التحديث بانتظار عودته','ban');return;}
  $('#bnUpdate').classList.remove('on');
  if(swReg&&swReg.waiting)swReg.waiting.postMessage('SKIP_WAITING');};
$('#bnUpdateX').onclick=()=>{updateSnoozed=true;$('#bnUpdate').classList.remove('on');
  toast('أُجّل التحديث — سيظهر مجددًا عند الاتصال','clock');};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone&&Date.now()-(S.meta.installDismiss||0)>3*864e5)
    setTimeout(()=>$('#bnInstall').classList.add('on'),4000);});
$('#bnInstallGo').onclick=async()=>{$('#bnInstall').classList.remove('on');
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}};
$('#bnInstallX').onclick=()=>{$('#bnInstall').classList.remove('on');S.meta.installDismiss=Date.now();save();};

window.addEventListener('hashchange',()=>{const hs=location.hash.replace('#','');
  if(hs==='focus')goTab('focus');
  else if(hs==='new-habit'){goTab('habits');setTimeout(()=>habitForm(),150);}
  else if(hs==='new-task'){goTab('tasks');setTimeout(()=>taskForm(),150);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(FT.running){FT.tick();FT.wlOn();}
  if(swReg)swReg.update().catch(()=>{});}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('immersive');});

/* ================= الإقلاع ================= */
function boot(){Confetti.init();applyTheme();FT.init();
  goTabNoHist('today');
  const hash=location.hash.replace('#','');
  if(hash==='focus'){goTab('focus');}
  else if(hash==='new-habit'){setTimeout(()=>habitForm(),300);}
  else if(hash==='new-task'){setTimeout(()=>taskForm(),300);}
  if(S.meta.firstRun)setTimeout(onboarding,350);
  else{setTimeout(showWhatsNew,650);setTimeout(checkAch,1200);}}
boot();
</script>
